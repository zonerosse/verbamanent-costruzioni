# Copia pubblica fatta da tools/costruzioni_pubbliche.py del progetto privato: non cambiarla qui.
# Il codice viene da zonerosse/registra-lezione-codice (chiave CODICE_TOKEN); i risultati delle prove tornano li'.
name: Prova del dito (XCUITest)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ramo del codice (progetto privato)
        default: main

permissions:
  contents: write
jobs:
  dito:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          repository: zonerosse/registra-lezione-codice
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.CODICE_TOKEN }}
      - name: Costruisci e prova il dito
        run: |
          exec > esito-idb.txt 2>&1
          set -x
          xcodebuild -version
          brew install xcodegen 2>&1 | tail -2
          cd tools/prova_iphone/tocca && xcodegen generate && cd -
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-7]( |$)" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b >/dev/null
          xcrun simctl launch "$DEV" com.apple.Preferences
          rm -f /tmp/tocchi_ok.txt /tmp/tocchi_cmd.txt
          (cd tools/prova_iphone/tocca && TEST_RUNNER_APP_DA_TOCCARE=com.apple.Preferences xcodebuild test -project Tocchi.xcodeproj -scheme Tocchi -destination "id=$DEV" 2>&1 | tail -40 > /tmp/xcb.txt) &
          for i in $(seq 1 120); do sleep 2; echo "1 200 300" > /tmp/tocchi_cmd.txt; [ -f /tmp/tocchi_ok.txt ] && break; done
          echo "ACK: $(cat /tmp/tocchi_ok.txt 2>/dev/null)"
          xcrun simctl io "$DEV" screenshot dopo.png
          echo fine > /tmp/tocchi_cmd.txt; sleep 20; cat /tmp/xcb.txt
      - name: Pubblica
        if: always()
        run: |
          mkdir e && cp esito-idb.txt dopo.png e/ 2>/dev/null; cd e && git init -q && git add . && git -c user.name=gh -c user.email=gh@x commit -qm dito
          git push -q -f "https://x-access-token:${{ secrets.CODICE_TOKEN }}@github.com/zonerosse/registra-lezione-codice" HEAD:esito-idb
